name: Ziņot par saiti
description: Krāpnieciska saite vai kļūdains URLguard brīdinājums
title: "[report] "
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Paldies! Saiti automātiski pārbaudīs, un pēc uzturētāja apstiprinājuma tā nonāks bāzē visiem lietotājiem.
        **Neievietojiet personīgus datus** (e-pastu, personas kodu, pieteikšanās saites ar žetoniem).
  - type: input
    id: url
    attributes:
      label: Saite
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: kind
    attributes:
      label: Veids
      description: "Aizpildās automātiski no URLguard. Ar roku: \"Krāpnieciska saite (phishing)\" vai \"Kļūdains brīdinājums (lapa ir droša)\""
      placeholder: Krāpnieciska saite (phishing)
  - type: input
    id: brand
    attributes:
      label: Zīmols (ja zināms)
      placeholder: piem. Swedbank, E-veselība, Latvijas Pasts
  - type: textarea
    id: note
    attributes:
      label: Piezīme
      placeholder: Kur saiti redzējāt? (SMS, e-pasts, Google reklāma…)
