# Izlaidums: git tag v1.2.3 && git push origin v1.2.3  -> testi, būve, GitHub Release (melnraksts) ar ZIP failiem veikaliem.
name: Izlaidums
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Versija sakrīt ar tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(node -p "require('./extension/package.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "package.json versija $V != tag ${GITHUB_REF_NAME}"; exit 1; }
      - run: node data/scripts/validate.mjs
      - run: pnpm --filter ./extension test
      - run: pnpm --filter ./extension typecheck
      - name: Būvēt (iebūvē jaunāko publicēto bāzi)
        run: pnpm --filter ./extension exec node build.mjs --repo "${{ github.repository }}"
      - name: Firefox lint
        working-directory: extension
        run: pnpm exec web-ext lint --source-dir dist/firefox --self-hosted=false
      - name: Pirmkoda arhīvs (Firefox AMO pārbaudītājiem)
        run: git archive --format=zip -o "BUILDS/URLguard_source_${GITHUB_REF_NAME}.zip" HEAD
      - name: GitHub Release (melnraksts)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" BUILDS/*.zip --draft --title "URLguard $GITHUB_REF_NAME" \
            --notes "Veikaliem: *_chrome_* -> Chrome Web Store un Edge Add-ons; *_firefox_* -> Firefox AMO (+ *_source_* kā pirmkods)."
      - uses: actions/upload-artifact@v4
        with:
          name: urlguard-builds
          path: BUILDS/*.zip
