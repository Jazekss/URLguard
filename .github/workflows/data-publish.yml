# Katru dienu (un pēc katras izmaiņas data/) uzbūvē un paraksta bāzi, publicē zarā "dist".
# Paplašinājumi to lejupielādē no jsDelivr: https://cdn.jsdelivr.net/gh/<repo>@dist/bundle.json
name: Publicēt bāzi
on:
  push:
    branches: [main]
    paths: ['data/**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter ./data
      - run: node data/scripts/validate.mjs
      - name: Būvēt un parakstīt
        env:
          URLGUARD_SIGNING_KEY: ${{ secrets.URLGUARD_SIGNING_KEY }}
        run: node data/scripts/build-bundle.mjs --feeds --sign --out data/dist
      - name: Publicēt zarā dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd data/dist
          git init -q -b dist
          git config user.name "urlguard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "bundle $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
      - name: Iztīrīt jsDelivr kešatmiņu
        run: |
          for f in bundle.json bundle.json.sig meta.json; do
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@dist/$f" > /dev/null || true
          done
