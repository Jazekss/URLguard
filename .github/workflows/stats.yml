# Katru dienu atjaunina STATS.md no releja publiskās statistikas.
name: Statistika
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter ./data
      - run: node data/scripts/stats-md.mjs
      - name: Commit
        run: |
          git config user.name "urlguard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATS.md
          git diff --cached --quiet || (git commit -m "stats: $(date -u +%Y-%m-%d)" && git push)
