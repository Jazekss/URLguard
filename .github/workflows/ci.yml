name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths: ['extension/**', 'data/**', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Datu validācija
        run: node data/scripts/validate.mjs
      - name: Dzinēja testi
        run: pnpm --filter ./extension test
      - name: Tipu pārbaude
        run: pnpm --filter ./extension typecheck
      - name: Būvēšana
        run: pnpm --filter ./extension exec node build.mjs --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: BUILDS/*.zip
