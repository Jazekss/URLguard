name = "urlguard-relay"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[vars]
GITHUB_REPO = "Jazekss/URLguard"
MAX_PER_HOUR = "10"

# npx wrangler kv namespace create RL  -> ieliec id šeit
[[kv_namespaces]]
binding = "RL"
id = "REPLACE_WITH_KV_ID"

# Slepenais tokens (nekad failā!):  npx wrangler secret put GITHUB_TOKEN
