<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URLguard</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 380px; min-height: 200px; }
    body.window { width: auto; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
    header img { width: 26px; height: 26px; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
    main { padding: 12px 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    main > *, form > * { min-width: 0; }
    select { max-width: 100%; text-overflow: ellipsis; }
    .status { border-left: 4px solid var(--c); background: var(--cb); }
    .status .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .status .host { font-weight: 600; margin: 4px 0; word-break: break-all; }
    .status ul { margin: 6px 0 0; padding-left: 18px; }
    .status li { margin: 2px 0; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { text-align: center; padding: 10px; }
    .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
    h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .log { list-style: none; margin: 0; padding: 0; max-height: 180px; overflow: auto; }
    .log li { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
    .log li:last-child { border-bottom: 0; }
    .log .h { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    form { display: grid; gap: 8px; }
    label.row { display: flex; gap: 8px; align-items: flex-start; }
    textarea, select, input[type=text], input[type=url] { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 6px 8px; }
    textarea { min-height: 54px; resize: vertical; }
    .msg { font-size: 13px; padding: 8px 10px; border-radius: 8px; }
    .msg.ok { background: var(--ok-bg); color: var(--ok); }
    .msg.err { background: var(--danger-bg); color: var(--danger); }
    details summary { cursor: pointer; font-weight: 600; }
    .settings { display: grid; gap: 8px; margin-top: 10px; }
    .update { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .update p { margin: 4px 0 10px; }
    .consent { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .consent p { margin: 6px 0 10px; }
    .row-btns { display: flex; gap: 8px; }
    #siteToggle { margin-top: 6px; display: block; }
    .sites { list-style: none; margin: 4px 0 0; padding: 0; }
    .sites li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--border); }
    .footer { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>URLguard</h1>
    <label class="switch"><input type="checkbox" id="enabled"> <span data-i18n="popup.protection"></span></label>
  </header>
  <main>
    <section class="card update" id="updateBox" hidden>
      <b id="updateTitle"></b>
      <p class="small" data-i18n="update.why"></p>
      <button type="button" class="primary" id="updateBtn" data-i18n="update.install"></button>
      <div class="small muted" id="updateMsg" hidden></div>
    </section>

    <section class="card consent" id="consent" hidden>
      <b data-i18n="consent.title"></b>
      <p class="small"><span data-i18n="consent.text"></span>
        <a id="privacyLink" target="_blank" rel="noopener" data-i18n="consent.what"></a></p>
      <div class="row-btns"><button class="primary" id="consentYes" data-i18n="consent.yes"></button><button id="consentNo" data-i18n="consent.no"></button></div>
    </section>

    <section class="card status v-unknown" id="status">
      <div class="head"><span class="pill" id="verdict">…</span><span class="muted small" id="statusSrc"></span></div>
      <div class="host" id="host"></div>
      <ul id="reasons"></ul>
      <button type="button" class="link small" id="siteToggle" hidden></button>
      <div id="officialBox" class="small" hidden><span data-i18n="status.officialAddr"></span> <a id="officialLink" target="_blank" rel="noopener"></a></div>
    </section>

    <section class="stats">
      <div class="card stat"><b id="statToday">0</b><span class="muted small" data-i18n="stats.today"></span></div>
      <div class="card stat"><b id="statTotal">0</b><span class="muted small" data-i18n="stats.total"></span></div>
    </section>

    <section class="card">
      <h2 data-i18n="report.title"></h2>
      <form id="reportForm">
        <input type="url" id="rUrl" required placeholder="https://…" class="mono small">
        <label class="row"><input type="radio" name="kind" value="phishing" checked> <span data-i18n="report.kindPhish"></span></label>
        <label class="row"><input type="radio" name="kind" value="false_positive"> <span data-i18n="report.kindFp"></span></label>
        <select id="rBrand"><option value="" data-i18n="report.brand"></option></select>
        <textarea id="rNote" maxlength="500" data-i18n-ph="report.note"></textarea>
        <label class="row small muted"><input type="checkbox" id="rQuery"> <span data-i18n="report.query"></span></label>
        <button class="primary" type="submit" id="rSend" data-i18n="report.send"></button>
        <div id="rMsg" class="msg" hidden></div>
        <div class="muted small" data-i18n="report.info"></div>
      </form>
    </section>

    <section class="card">
      <h2 data-i18n="log.title"></h2>
      <ul class="log" id="log"></ul>
      <div class="muted small" id="logEmpty" data-i18n="log.empty"></div>
    </section>

    <section class="card">
      <details>
        <summary data-i18n="settings.title"></summary>
        <div class="settings">
          <label><span data-i18n="settings.lang"></span>
            <select id="lang"><option value="auto" data-i18n="settings.langAuto"></option></select>
          </label>
          <label><span data-i18n="settings.serpMode"></span>
            <select id="serpMode">
              <option value="mark" data-i18n="settings.serpMark"></option>
              <option value="hide" data-i18n="settings.serpHide"></option>
            </select>
          </label>
          <label class="row"><input type="checkbox" id="serpOfficialBadge"> <span data-i18n="settings.officialBadge"></span></label>
          <label class="row"><input type="checkbox" id="pageChecks"> <span data-i18n="settings.pageChecks"></span></label>
          <label class="row"><input type="checkbox" id="shareStats"> <span data-i18n="settings.stats"></span></label>
          <label class="row" id="accentRow" hidden><input type="checkbox" id="accentIcon"> <span data-i18n="settings.accentIcon"></span></label>
          <div class="small"><span data-i18n="settings.disabledSites"></span>
            <ul class="sites" id="disabledList"></ul>
          </div>
          <label class="small"><span data-i18n="settings.endpoint"></span>
            <input type="text" id="reportEndpoint" placeholder="https://…workers.dev/report">
          </label>
          <div class="footer small">
            <span class="muted" id="dataInfo"></span>
            <button type="button" id="updateNow" data-i18n="settings.update"></button>
          </div>
          <div class="footer small">
            <span class="muted" id="versionInfo"></span>
            <button type="button" id="checkUpdate" data-i18n="update.check"></button>
          </div>
          <button type="button" id="grant" hidden data-i18n="settings.grant"></button>
        </div>
      </details>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
