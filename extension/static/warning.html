<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URLguard</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--danger-bg); }
    main { max-width: 620px; width: 100%; }
    .head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    .icon { width: 56px; height: 56px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 30px; background: var(--danger); color: #fff; }
    h1 { font-size: 24px; line-height: 1.25; margin: 0; color: var(--danger); }
    .url { margin: 4px 0 0; }
    .url .dom { font-weight: 700; background: var(--danger-bg); color: var(--danger); padding: 0 3px; border-radius: 4px; }
    ul { margin: 10px 0 0; padding-left: 20px; }
    li { margin: 4px 0; }
    .official { margin-top: 14px; border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); background: var(--ok-bg); }
    .official b { color: var(--ok); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
    .actions .spacer { flex: 1; }
    footer { margin-top: 22px; display: flex; gap: 16px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <div class="head">
      <div class="icon" aria-hidden="true">!</div>
      <div>
        <h1 id="title" data-i18n="warn.title"></h1>
        <div class="muted" data-i18n="warn.stopped"></div>
      </div>
    </div>

    <div class="card">
      <div class="muted small" data-i18n="warn.tried"></div>
      <p class="url mono" id="url"></p>
      <ul id="reasons"></ul>
    </div>

    <div class="card official" id="official" hidden>
      <span id="didYouMean"></span>
      <a id="officialLink" class="mono"></a>
    </div>

    <div class="actions">
      <button class="primary" id="goOfficial" hidden data-i18n="warn.goOfficial"></button>
      <button id="back" data-i18n="warn.back"></button>
      <span class="spacer"></span>
    </div>

    <footer class="small">
      <button class="link" id="falsePositive" data-i18n="warn.fp"></button>
      <button class="link" id="proceed" data-i18n="warn.proceed"></button>
    </footer>
  </main>
  <script src="warning.js"></script>
</body>
</html>
